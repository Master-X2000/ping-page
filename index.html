<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <!-- || Links to the styles and js pages -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <script src="index.js" defer></script>
  
  <title>Frontend Mentor | Ping coming soon page</title>
</head>
<body>

  <main class="container">
    <section class="header">
      <img src="images/logo.svg" alt="" class="logo">

      <h1 class="heading">
        We are launching <span class="highlight">soon!</span>
      </h1>

      <p class="text">
        Subscribe and get notified
      </p>
    </section>

    <section class="content">
      <form action="#" class="notify">
        <div class="input-control">
          <input
            type="text"
            class="email"
            placeholder="Your email address..."
          >
          <div class="error"></div>
        </div>

        <button type="submit" class="submit">
          Notify Me
        </button>
      </form>

      <img src="images/illustration-dashboard.png" alt="" class="dashboard">
    </section>

    <section class="footer">
      <div class="socials">
        <i class="fa-brands fa-facebook-f icon"></i>
        <i class="fa-brands fa-twitter icon"></i>
        <i class="fa-brands fa-instagram icon"></i>
      </div>

      <p class="copy-right">
        &copy; Copyright Ping. All rights reserved.
      </p>
    </section>
  </main>

  <footer>
    <p class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a href="https://www.frontendmentor.io/profile/Master-X2000">Odezime Excel</a>.
    </p>
  </footer>
</body>
</html>
